config: |-
  consensus:
    network: mainnet
  log:
    level: info
    file:
      enabled: false

apiPassword: ~

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "master"
  pullSecrets: []

livenessProbe:
  httpGet:
    path: /api/health
    port: api-port
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 30 # can be slow when syncing
  failureThreshold: 3

resources: {}

volumeClaims:
  resources: {}