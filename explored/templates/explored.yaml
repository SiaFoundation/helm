apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  explored.yml: |- 
{{ .Values.config | indent 4 }}

---

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api-password
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  password: {{ .Values.apiPassword | default (randAlphaNum 16) | b64enc }}

--- 

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 10
      restartPolicy: Always
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets: 
        {{ toYaml .Values.image.pullSecrets | indent 8 }}
      {{- end }}
      containers:
      - name: {{ .Release.Name }}
        image: ghcr.io/siafoundation/explored:{{ .Values.image.tag | default "latest" }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        ports:
        - containerPort: 9980
        env:
          - name: EXPLORED_API_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-api-password
                key: password
          - name: EXPLORED_CONFIG_FILE
            value: /etc/explored/explored.yml
        volumeMounts:
        - name: {{ .Release.Name }}-config
          mountPath: /etc/explored # we could use subpath, but it would not be updated on change
        - name: {{ .Release.Name }}-data
          mountPath: /data
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
      volumes:
      - name: {{ .Release.Name }}-config
        configMap:
          name: {{ .Release.Name }}-config
  serviceName: {{ .Release.Name }}
  volumeClaimTemplates:
  - metadata:
      name: {{ .Release.Name }}-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.volumeClaims.resources }}
      resources:
        {{- toYaml .Values.volumeClaims.resources | nindent 8 }}
      {{- end }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: LoadBalancer
  ports:
    - name: api
      port: 9980
      targetPort: 9980
  selector:
    app: {{ .Release.Name }}