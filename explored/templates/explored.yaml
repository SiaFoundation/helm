apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-explored-config
  namespace: {{ .Release.Namespace }}
data:
  explored.yml: |-
    network: {{ .Values.network | default "mainnet" }}
    log:
      level: {{ .Values.logLevel | default "info" }}
      file:
        enabled: false

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-explored
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-explored
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-explored
    spec:
      terminationGracePeriodSeconds: 10
      restartPolicy: Always
      containers:
      - name: {{ .Release.Name }}-explored
        image: ghcr.io/siafoundation/explored:{{ .Values.image.tag | default "latest" }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        {{- if .Values.image.pullSecrets }}
        imagePullSecrets:
          {{- toYaml .Values.image.pullSecrets | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: 9980
        env:
          - name: EXPLORED_CONFIG_FILE
            value: /etc/explored/explored.yml
        volumeMounts:
        - name: {{ .Release.Name }}-explored-config
          mountPath: /etc/explored # we could use subpath, but it would not be updated on change
        - name: {{ .Release.Name }}-explored-data
          mountPath: /data
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
      volumes:
      - name: {{ .Release.Name }}-explored-config
        configMap:
          name: {{ .Release.Name }}-explored-config
  serviceName: {{ .Release.Name }}-explored
  volumeClaimTemplates:
  - metadata:
      name: {{ .Release.Name }}-explored-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.volumeClaims.resources }}
      resources:
        {{- toYaml .Values.volumeClaims.resources | nindent 8 }}
      {{- end }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-explored
  namespace: {{ .Release.Namespace }}
spec:
  type: LoadBalancer
  ports:
    - name: api
      port: 9980
      targetPort: 9980
  selector:
    app: {{ .Release.Name }}-explored