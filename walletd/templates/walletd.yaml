apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  walletd.yml: |- 
{{ .Values.config | indent 4 }}

---

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api-password
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  password: {{ .Values.apiPassword | default (randAlphaNum 16) | b64enc }}

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 10
      restartPolicy: Always
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets: 
        {{ toYaml .Values.image.pullSecrets | indent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{ toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: 
            matchLabels:
              app: {{ .Release.Name }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: topology.kubernetes.io/zone
      containers:
        - name: {{ .Release.Name }}
          image: ghcr.io/siafoundation/walletd:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          ports:
          - containerPort: 9980
          env:
            - name: WALLETD_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api-password
                  key: password
            - name: WALLETD_CONFIG_FILE
              value: /etc/walletd/walletd.yml
          volumeMounts:
          - name: {{ .Release.Name }}-config
            mountPath: /etc/walletd # we could use subpath, but it would not be updated on change
          - name: {{ .Release.Name }}-data
            mountPath: /data
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          {{ if .Values.readinessProbe }}
          readinessProbe: 
            {{ toYaml .Values.readinessProbe | nindent 12 }}
          {{ end }}
      volumes:
        - name: {{ .Release.Name }}-config
          configMap:
            name: {{ .Release.Name }}-config
  serviceName: {{ .Release.Name }}
  volumeClaimTemplates:
  - metadata:
      name: {{ .Release.Name }}-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.volumeClaims.resources }}
      resources:
        {{- toYaml .Values.volumeClaims.resources | nindent 8 }}
      {{- end }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: LoadBalancer
  ports:
    - name: api
      port: 9980
      targetPort: 9980
  selector:
    app: {{ .Release.Name }}