config: |-
  consensus:
    network: mainnet
  log:
    level: info
    file:
      enabled: false

replicas: 1
apiPassword: ~

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "master"
  pullSecrets: []

resources: {}

volumeClaims:
  resources: {}

readinessProbe:
  httpGet:
    path: /api/health
    port: 9980
  initialDelaySeconds: 10
  periodSeconds: 60
  timeoutSeconds: 60
  failureThreshold: 5